<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enquire — Abigail Rae</title>
  <meta name="description" content="Send Abigail Rae your tattoo idea and she'll be in touch to quote and book." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #fdfcfb; --ink: #2e2c2b; --ink-soft: #6a6764;
      --line: #e8e4e0; --accent: #c0392b;
      --sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--paper); color: var(--ink);
      font-family: var(--sans); font-weight: 300;
      -webkit-font-smoothing: antialiased; cursor: url('abigail-assets/cursor64.png') 32 32, auto;
      overflow-x: hidden;
    }
    a, button, input, select, textarea, label { cursor: url('abigail-assets/cursor64_mirror.png') 32 32, pointer; }
    img { display: block; max-width: 100%; }

    .wrap { max-width: 620px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .topbar {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; margin-bottom: 2.2rem;
    }
    .back {
      font-size: .68rem; font-weight: 400; letter-spacing: -.04em;
      text-transform: uppercase; color: var(--ink-soft); text-decoration: none;
    }
    .back:hover { color: var(--accent); }
    .wordmark {
      font-family: Georgia, 'Times New Roman', serif; font-variant: small-caps;
      letter-spacing: .05em; line-height: .9; font-size: clamp(1.6rem, 7vw, 2.2rem);
      text-align: right;
    }
    .wordmark .accent { color: var(--accent); }

    .lead-h {
      font-family: "Pinyon Script", cursive; font-size: clamp(2.4rem, 10vw, 3.2rem);
      opacity: .75; line-height: 1; margin-bottom: .6rem;
    }
    .lead-p {
      font-size: clamp(.9rem, 3.6vw, 1rem); line-height: 1.6;
      color: var(--ink-soft); max-width: 46ch; margin-bottom: 2.2rem;
    }

    form { display: flex; flex-direction: column; gap: 1.4rem; }
    .field { display: flex; flex-direction: column; gap: .4rem; }
    label.lbl {
      font-size: .7rem; font-weight: 500; letter-spacing: .04em;
      text-transform: uppercase; color: var(--ink);
    }
    .lbl .opt { color: var(--ink-soft); font-weight: 400; text-transform: none; letter-spacing: 0; }
    input[type="text"], input[type="email"], input[type="tel"], textarea, select {
      font-family: var(--sans); font-size: .95rem; font-weight: 300; color: var(--ink);
      background: #fff; border: 1px solid var(--line); border-radius: 2px;
      padding: .7rem .8rem; width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 110px; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row .field { flex: 1; min-width: 180px; }

    /* type chips */
    .chips { display: flex; gap: .6rem; flex-wrap: wrap; }
    .chip {
      position: relative; border: 1px solid var(--line); border-radius: 999px;
      padding: .5rem 1rem; font-size: .8rem; color: var(--ink); background: #fff;
      user-select: none;
    }
    .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; }
    .chip.sel { border-color: var(--accent); color: var(--accent); }

    .filehint { font-size: .72rem; color: var(--ink-soft); }
    .thumbs { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
    .thumbs img { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--line); border-radius: 2px; }

    .btn {
      align-self: flex-start; margin-top: .4rem;
      border: 1px solid var(--accent); color: var(--accent);
      text-transform: uppercase; letter-spacing: .18em; font-size: .66rem; font-weight: 500;
      padding: .8rem 1.6rem; background: linear-gradient(var(--accent), var(--accent)) no-repeat center / 0% 100%;
      transition: background-size .6s ease, color .6s ease;
    }
    .btn:hover:not(:disabled) { background-size: 100% 100%; color: #fff; }
    .btn:disabled { opacity: .5; }

    .err { color: var(--accent); font-size: .82rem; min-height: 1em; }

    /* success */
    .done { text-align: center; padding: 3rem 0; }
    .done .lead-h { opacity: .8; }
    .done p { color: var(--ink-soft); line-height: 1.7; max-width: 40ch; margin: 0 auto 1.6rem; }
    .done a.btn { display: inline-block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/abigail">‹ Back</a>
      <h1 class="wordmark">Abigail <span class="accent">Rae</span></h1>
    </div>

    <div id="form-view">
      <p class="lead-h">tell me your idea</p>

      <form id="enquiry-form" novalidate>
        <div class="field">
          <label class="lbl" for="name">Your name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div class="row">
          <div class="field">
            <label class="lbl" for="email">Email <span class="opt">— email or phone</span></label>
            <input type="email" id="email" name="email" autocomplete="email" />
          </div>
          <div class="field">
            <label class="lbl" for="phone">Phone <span class="opt">— optional</span></label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" />
          </div>
        </div>

        <div class="field">
          <label class="lbl">What kind of piece?</label>
          <div class="chips" id="type-chips">
            <label class="chip"><input type="radio" name="tattoo_type" value="flash" />Flash</label>
            <label class="chip"><input type="radio" name="tattoo_type" value="custom" />Custom design</label>
            <label class="chip"><input type="radio" name="tattoo_type" value="unsure" />Not sure yet</label>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label class="lbl" for="size">Rough size <span class="opt">— optional</span></label>
            <input type="text" id="size" name="size" placeholder="e.g. 3-4 inches" />
          </div>
          <div class="field">
            <label class="lbl" for="placement">Placement <span class="opt">— optional</span></label>
            <input type="text" id="placement" name="placement" placeholder="e.g. forearm" />
          </div>
          <div class="field">
            <label class="lbl" for="budget">Budget <span class="opt">— optional</span></label>
            <input type="text" id="budget" name="budget" placeholder="e.g. £200-300" />
          </div>
        </div>

        <div class="field">
          <label class="lbl" for="idea">Your idea</label>
          <textarea id="idea" name="idea" placeholder="Describe what you have in mind" required></textarea>
        </div>

        <div class="field">
          <label class="lbl" for="refs">Reference images <span class="opt">— optional, up to 6</span></label>
          <input type="file" id="refs" name="refs" accept="image/*" multiple />
          <span class="filehint">Sketches, screenshots, photos of the spot — anything that helps.</span>
          <div class="thumbs" id="thumbs"></div>
        </div>

        <div class="err" id="err"></div>
        <button class="btn" id="submit" type="submit">Send Enquiry</button>
      </form>
    </div>

    <div class="done" id="done-view" hidden>
      <p class="lead-h">thank you</p>
      <p>Your enquiry is in. Abigail will get back to you soon to talk through your idea and find a date.</p>
      <a class="btn" href="/abigail">Back to home</a>
    </div>
  </div>

  <script>
    var studio = "abigail-rae";
    var images = [];  // downscaled data URLs

    // type chip toggle styling
    document.querySelectorAll("#type-chips .chip input").forEach(function (inp) {
      inp.addEventListener("change", function () {
        document.querySelectorAll("#type-chips .chip").forEach(function (c) { c.classList.remove("sel"); });
        if (inp.checked) inp.closest(".chip").classList.add("sel");
      });
    });

    // Downscale each chosen image to keep the payload small, then thumbnail it.
    var thumbs = document.getElementById("thumbs");
    document.getElementById("refs").addEventListener("change", function (e) {
      var files = Array.prototype.slice.call(e.target.files || []).slice(0, 6);
      images = []; thumbs.innerHTML = "";
      files.forEach(function (file) {
        if (!/^image\//.test(file.type)) return;
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var max = 1200, scale = Math.min(1, max / Math.max(img.width, img.height));
            var cv = document.createElement("canvas");
            cv.width = Math.round(img.width * scale);
            cv.height = Math.round(img.height * scale);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            var url = cv.toDataURL("image/jpeg", 0.82);
            images.push(url);
            var t = new Image(); t.src = url; thumbs.appendChild(t);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    });

    var form = document.getElementById("enquiry-form");
    var errEl = document.getElementById("err");
    var btn = document.getElementById("submit");

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      errEl.textContent = "";
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var idea = document.getElementById("idea").value.trim();
      var type = (document.querySelector('input[name="tattoo_type"]:checked') || {}).value || "";

      if (!name) return (errEl.textContent = "Please add your name.");
      var emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
      if (!emailOk && !phone) return (errEl.textContent = "Leave an email or phone so Abigail can reply.");
      if (!idea) return (errEl.textContent = "Tell Abigail a little about your idea.");

      btn.disabled = true; btn.textContent = "Sending…";
      fetch("/api/enquiries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name, email: email, phone: phone,
          tattoo_type: type,
          size: document.getElementById("size").value.trim(),
          placement: document.getElementById("placement").value.trim(),
          budget: document.getElementById("budget").value.trim(),
          description: idea, reference_images: images, studio: studio,
        }),
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.d && res.d.error || "Something went wrong.");
          document.getElementById("form-view").hidden = true;
          document.getElementById("done-view").hidden = false;
          window.scrollTo({ top: 0, behavior: "smooth" });
        })
        .catch(function (e) {
          errEl.textContent = e.message || "Something went wrong. Please try again.";
          btn.disabled = false; btn.textContent = "Send Enquiry";
        });
    });
  </script>
</body>
</html>
